services:
  localaws:
    build: .
    image: localaws:latest
    ports:
      - "4566:4566"
    environment:
      LOCALAWS_RUNNER: docker
      # LOCALAWS_CONFIG: /config/localaws.json
      # LOCALAWS_DOCKER_NETWORK: my-app-network      # where task containers find your database etc.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localaws-data:/var/lib/localaws/data
      # - ./examples/pipeline:/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  localaws-data:
